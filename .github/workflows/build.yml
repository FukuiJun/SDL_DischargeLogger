name: Build SDL_DischargeLogger.exe

on:
  push:
  pull_request:
  # Actions の画面（Run workflow）から実行するとき、バージョンを入れるとそのリリースを作る
  workflow_dispatch:
    inputs:
      release_version:
        description: "リリースするバージョン（例 1.0.0。src/main.py の VERSION と同じ値）。空欄ならリリースしない"
        required: false
        default: ""

# Release を作ってファイルを添付するため
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # パッケージのインストール → テスト（pytest）→ PyInstaller でフォルダ形式の exe（dist\SDL_DischargeLogger\SDL_DischargeLogger.exe）
      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      # 起動してウィンドウが表示されるまでの時間を 3 回測る（1 回目はウイルス対策ソフトの初回スキャン・
      # matplotlib のフォント一覧の作成込み）。2 回目以降が 10 秒を超えたら失敗にする（8 章 起動時間）
      - name: Smoke test and startup time
        shell: pwsh
        run: |
          # タイトルバー左上のアイコンを撮影して確かめる（空だと Windows 標準の白い四角になる）。
          # アイコンの黒い液晶の画素があれば OK。撮影した画像は Artifacts（titlebar）に保存する
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@
          function Test-TitleBarIcon {
            # $null を渡すと PowerShell が空文字列に変えてしまうため [NullString]::Value を使う
            $h = [Win]::FindWindow([NullString]::Value, "SDL_DischargeLogger")
            if ($h -eq [IntPtr]::Zero) {
              $proc = Get-Process -Name SDL_DischargeLogger -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
              if ($proc) { $h = $proc.MainWindowHandle }
            }
            if ($h -eq [IntPtr]::Zero) { throw "ウィンドウ（SDL_DischargeLogger）が見つかりません" }
            [Win]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Milliseconds 500
            $r = New-Object Win+RECT
            [Win]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap 420, 60
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $bmp.Size)
            New-Item -ItemType Directory -Force -Path shots | Out-Null
            $bmp.Save((Join-Path (Get-Location) "shots\titlebar.png"))
            $bg = $bmp.GetPixel(300, 18)
            if (($bg.R + $bg.G + $bg.B) / 3 -lt 150) {
              Write-Warning "タイトルバーを撮影できなかったため、アイコンの確認を省略しました"
              return
            }
            $dark = 0
            for ($x = 0; $x -lt 36; $x++) { for ($y = 0; $y -lt 44; $y++) {
              $c = $bmp.GetPixel($x, $y)
              if ($c.R -lt 60 -and $c.G -lt 60 -and $c.B -lt 60) { $dark++ }
            } }
            Write-Host "タイトルバーのアイコン領域の黒い画素: $dark"
            if ($dark -lt 10) { throw "タイトルバーにアプリのアイコンが表示されていません（shots/titlebar.png を参照）" }
          }

          # フォルダ形式（exe と _internal）なので、フォルダごと別の場所にコピーして起動する
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          Copy-Item dist\SDL_DischargeLogger $dir -Recurse
          $exePath = Join-Path $dir "SDL_DischargeLogger.exe"
          if (-not (Test-Path $exePath)) { throw "dist\SDL_DischargeLogger\SDL_DischargeLogger.exe がありません" }
          $times = @()
          for ($i = 1; $i -le 3; $i++) {
            $ready = Join-Path $env:RUNNER_TEMP "ready-$i.txt"
            $env:SDL_LOGGER_READY_FILE = $ready
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exePath -PassThru
            while (-not (Test-Path $ready)) {
              if ($p.HasExited) { throw "exe が終了しました（終了コード $($p.ExitCode)）" }
              if ($sw.Elapsed.TotalSeconds -gt 90) { throw "90 秒たってもウィンドウが表示されません" }
              Start-Sleep -Milliseconds 20
            }
            $sw.Stop()
            $times += $sw.Elapsed.TotalSeconds
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "exe が表示直後に終了しました" }
            if ($i -eq 3) { Test-TitleBarIcon }
            # 子プロセスがあっても残らないように、子も含めて止める
            taskkill /PID $p.Id /T /F | Out-Null
            Start-Sleep -Seconds 1
          }
          $log = Join-Path $dir "sdl_logger.log"
          if (-not (Test-Path $log)) { throw "exe と同じフォルダに sdl_logger.log が作られていません" }
          Write-Host ("起動時間（ウィンドウ表示まで）: " + (($times | ForEach-Object { "{0:N2}秒" -f $_ }) -join " / "))
          if ($times[1] -gt 10 -or $times[2] -gt 10) { throw "起動に 10 秒以上かかっています" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titlebar
          path: shots/
          if-no-files-found: ignore

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item dist\SDL_DischargeLogger out -Recurse
          Copy-Item README.md out\SDL_DischargeLogger

      - uses: actions/upload-artifact@v4
        with:
          name: SDL_DischargeLogger
          path: out/
          if-no-files-found: error

      # リリースするときだけ（タグ vX.Y.Z のプッシュ／Run workflow でバージョン指定）：
      # Releases に SDL_DischargeLogger-vX.Y.Z.zip（展開すると SDL_DischargeLogger フォルダ。中に exe・_internal・README.md）を載せる
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = "v" + $env:RELEASE_VERSION.Trim().TrimStart("v", "V")
          } else {
            $tag = $env:REF_NAME
          }
          $version = (Select-String -Path src\main.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$version") {
            throw "タグ $tag と src\main.py の VERSION ($version) が一致しません。タグは v$version にしてください（VERSION を変える場合は先にコミット）"
          }
          $zip = "SDL_DischargeLogger-$tag.zip"
          Compress-Archive -Path out\SDL_DischargeLogger -DestinationPath $zip
          $notes = @"
          ## ダウンロードと導入
          1. 下の **$zip** をダウンロード（「Source code」はソースコードで、exe は入っていません）
          2. zip を右クリック →「すべて展開」すると **SDL_DischargeLogger** フォルダができます
          3. フォルダごと好きな場所に置き、中の **SDL_DischargeLogger.exe** をダブルクリック
             （Python・NI-VISA などのインストールは不要。exe だけを取り出しても動きません。同じフォルダの _internal が必要です）
          4. 設定ファイル・ログ・保存先の初期値は exe と同じフォルダです。書き込めるフォルダ（C:\Program Files 以外）に置いてください
          5. v1.0.8 以前（exe 1 つの形）から移る場合は、前の exe の隣の sdl_logger_settings.json を新しいフォルダにコピーすると設定を引き継げます

          PC と SDL1020X-E の LAN 設定・使い方は同梱の README.md を参照してください。

          ## 注意
          - CC 設定・負荷 ON/OFF・Von の SCPI コマンド（SPEC.md Q-02）は実機での確認前です。
            Von を設定できないと表示されたら、［Von を自動設定］のチェックを外すと今までどおり使えます。
            うまく動かないときは、exe と同じフォルダの sdl_logger.log を添えて連絡してください
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 既にリリースがある場合（画面から先に作った等）は添付だけ行う
            gh release upload $tag $zip --clobber
            gh release edit $tag --title "SDL_DischargeLogger $tag"
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            # タグが無ければ、このビルドのコミットにタグを付けてリリースを作る
            gh release create $tag $zip --title "SDL_DischargeLogger $tag" --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release create $tag $zip --title "SDL_DischargeLogger $tag" --notes $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "リリースの作成・添付に失敗しました" }
          Write-Host "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
